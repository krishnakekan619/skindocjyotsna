# Compiles, tests and builds the Windows .exe and the macOS universal .dmg on GitHub-hosted
# machines (DEC-021: the development laptop cannot run unsigned programs such as rustc).
#
# Node.js and Rust versions come from setup/windows/tools.lock, so CI uses the same pinned
# releases as the offline setup bundles.
#
# RELEASES: pushing a tag vX.Y.Z (matching "version" in package.json) builds both installers and
# publishes a GitHub Release with the .exe, .dmg, their .sha256 files, BUILDINFO files and a
# combined SHA256SUMS. Unlike build artifacts (deleted after 14 days), releases are kept.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Supply chain (review 2026-09-27): every action is pinned to a full commit SHA (the version is in
# the comment; Dependabot proposes updates), Rust crates are checked for known vulnerabilities by
# cargo-deny on every run, and release (tag) builds never reuse a cache written by other runs.
# Still open: code-signing secrets (Apple Developer ID / Windows certificate) when available (Q15).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (.exe)
            os: windows-latest
            rust_targets: ''
          - name: macOS universal (.dmg)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected). Bump the version or fix the tag."
            exit 1
          fi

      - name: Read pinned tool versions (setup/windows/tools.lock)
        shell: bash
        run: |
          lock=setup/windows/tools.lock
          echo "NODE_VERSION=$(grep '^NODE_VERSION=' "$lock" | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"
          echo "RUST_VERSION=$(grep '^RUST_VERSION=' "$lock" | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_targets }}
          components: clippy, rustfmt

      # Release (tag) builds start clean: a cache written by an ordinary run could otherwise
      # end up inside a published installer.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Tool versions
        shell: bash
        run: node -v && npm -v && rustc -V && cargo -V

      - name: Install npm packages
        run: npm ci --no-audit --no-fund

      - name: Check locks (stable releases, checksums)
        run: node scripts/check-locks.mjs

      # Every SQL statement prepares against the real schema, and the protective triggers hold
      # (Node's built-in SQLite: no Rust needed).
      - name: Database checks (SQL and triggers)
        run: |
          node --no-warnings scripts/dev/check-sql.mjs
          node --no-warnings scripts/dev/check-triggers.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test and build installer
        run: node scripts/build-release.mjs

      - name: Dependency audit (npm, including build tools)
        run: npm audit --audit-level=high

      # Quality checks: report only for now (DEC-038). They show their findings in the log and as
      # annotations but do not fail the build; they become blocking once the findings are fixed.
      - name: Rust lints (clippy, report only)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust formatting (rustfmt, report only)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo fmt --all -- --check


      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SkinDocJyotsna-${{ matrix.os }}
          path: dist/release/**
          retention-days: 14
          if-no-files-found: error

      # The Cargo.lock each build resolved (Windows and macOS resolve separately), kept with the
      # release so the exact Rust crate versions in each installer stay traceable.
      - name: Name the Cargo.lock after this platform
        if: always()
        shell: bash
        run: '[ -f Cargo.lock ] && cp Cargo.lock "Cargo-${{ runner.os }}.lock" || true'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Cargo-lock-${{ matrix.os }}
          path: Cargo-${{ runner.os }}.lock
          if-no-files-found: ignore

  # Known vulnerabilities and unknown sources in Rust crates block the build (DEC-038).
  audit:
    name: Rust dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories sources

  release:
    name: Publish GitHub Release
    needs: [build, audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only this job may create releases
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: SkinDocJyotsna-*
          path: release-files
          merge-multiple: true

      # The Cargo.lock of each platform (BUILDINFO's CARGO_LOCK_SHA256 refers to it).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Cargo-lock-*
          path: release-files
          merge-multiple: true

      # Artifacts keep their folder layout (dist/release/<version>/...): flatten to one folder.
      - name: Collect release files
        working-directory: release-files
        run: |
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -mindepth 1 -type d -empty -delete
          leftovers=$(find . -mindepth 2 -type f | wc -l)
          [ "$leftovers" -eq 0 ] || { echo "::error::Duplicate file names between artifacts"; find . -mindepth 2 -type f; exit 1; }

      - name: Verify installers against their .sha256 files
        working-directory: release-files
        run: |
          ls -la
          count=0
          for sum in *.sha256; do sha256sum --check "$sum"; count=$((count + 1)); done
          [ "$count" -ge 2 ] || { echo "::error::Expected a Windows and a macOS installer, found $count"; exit 1; }
          sha256sum *.exe *.dmg Cargo-*.lock > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release-files
        run: |
          {
            echo "## SkinDocJyotsna ${GITHUB_REF_NAME}"
            echo
            echo "Built from commit ${GITHUB_SHA} by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            awk '{print "| `" $2 "` | `" $1 "` |"}' SHA256SUMS
            echo
            echo "**Install:** Windows: run the \`.exe\` (or add it to an offline bundle with \`node scripts/import-release.mjs\`). macOS: open the \`.dmg\` and drag the app to Applications."
            echo "The installers are not code-signed yet: Windows SmartScreen and macOS Gatekeeper will ask for confirmation on first run."
          } > NOTES.md
          gh release create "$GITHUB_REF_NAME" --title "SkinDocJyotsna $GITHUB_REF_NAME" --notes-file NOTES.md --verify-tag \
            *.exe *.dmg *.sha256 BUILDINFO-*.txt SHA256SUMS Cargo-*.lock
